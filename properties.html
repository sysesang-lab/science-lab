<!doctype html><html lang="ko"><meta charset="utf-8"><script src="design.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Science Lab</title><style>body{font:16px system-ui;background:#eef4f5;color:#23434b;max-width:850px;margin:auto;padding:16px}header,section{padding:20px;border-radius:16px;background:white;margin:12px 0}header{background:#174650;color:white}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button,select{font:inherit;padding:12px;border:1px solid #b6d0d3;border-radius:9px;background:white;color:#174650;cursor:pointer}button.active,button.action{background:#236f77;color:white}label{display:block;margin:12px 0}input[type=range],textarea{width:100%;box-sizing:border-box}textarea{padding:10px;border:1px solid #b6d0d3;border-radius:8px;font:inherit}svg{width:100%;max-height:300px;background:#f5fafb;border-radius:12px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}#actions{display:flex;flex-wrap:wrap;gap:8px}small{color:#54727a}</style><header><a href="index.html" style="color:white">← 전체 실험실</a><br><small style="color:#bce1df">MY SCIENCE LAB</small><h1>물질의 특성</h1><div id="progress"></div></header><nav id="nav"></nav><section><h2 id="title"></h2><p id="mission"></p><input type="hidden" id="hyp"><div id="extraDesign"></div><div id="controls"></div><svg id="scene" viewBox="0 0 360 220"></svg><p id="result"></p><div id="actions"></div></section><section><h3>실험 노트</h3><button onclick="record()">측정값 기록</button> <button onclick="reset()">실험 초기화</button><table id="records"></table><svg id="graph" viewBox="0 0 360 200"></svg><input type="hidden" id="con"><details><summary>힌트</summary><p id="hint"></p></details><details><summary>실험 원리</summary><p id="principle"></p></details><button class="action" onclick="done()">실험 완료</button></section><small>교육용 이상화 모델. 실제 측정 오차 및 열 손실은 생략했습니다. 기록은 이 브라우저에 저장됩니다.</small><script>
const $=x=>document.getElementById(x), names=['순물질과 혼합물','금속의 밀도','농도와 밀도','온도와 용해도','결정 석출','끓는점 비교','밀도 차에 의한 분리','크로마토그래피'], missions=['소금과 모래를 각각 회수하세요.','금속의 질량과 부피 관계를 조사하세요.','농도가 다른 설탕물로 층을 만드세요.','온도에 따른 최대 용해량을 비교하세요.','뜨거운 포화 용액을 냉각하세요.','물과 소금물의 가열 곡선을 비교하세요.','물과 기름을 분별깔때기로 분리하세요.','혼합 색소의 이동 거리를 비교하세요.'], hints=['물에 녹는 성질의 차이를 이용하세요.','질량을 부피로 나누어 보세요.','밀도가 큰 용액을 먼저 넣어 보세요.','물의 양을 일정하게 유지하세요.','냉각 전후 용해도를 비교하세요.','끓기 시작한 온도를 비교하세요.','아래층부터 배출하세요.','용매와 색소의 이동 거리를 비교하세요.'], principles=['용해성 차이로 여과하고 증발로 소금을 회수한다.','밀도는 질량/부피이며 같은 물질에서 일정하다.','설탕물은 농도가 높을수록 밀도가 크다.','용해도는 물 100g에 최대로 녹는 용질의 질량이다.','냉각으로 용해도가 감소하면 결정이 석출된다.','비휘발성 용질은 용액의 끓는점을 높인다.','서로 섞이지 않는 액체는 밀도 차이로 분리할 수 있다.','색소마다 이동상과 고정상에 대한 친화력이 달라 이동률이 다르다.'];
let i=0;const defaults=()=>[{salt:3,sand:3,w:0,d:0,rs:0,rd:0},{metal:0,v:5,m:false,b:false},{c:10,v:30,l:[]},{k:0,t:20,w:100,a:40,test:false},{h:80,t:20,w:100,stage:0},{salt:0,t:20,time:0,e:0},{w:60,o:40,rw:0,ro:0,stage:0},{ink:0,sol:0,f:0}];let states=defaults(),notes=names.map(()=>({h:'',c:'',r:[],done:false}));try{let x=JSON.parse(localStorage.getItem('scienceLabV1'));if(x)notes=x}catch{};let s=()=>states[i],n=()=>notes[i],fmt=x=>Number(x).toFixed(2),metals=['알루미늄','철','구리','아연'],ds=[2.7,7.87,8.96,7.14],table=[[0,13.3,35.7],[20,31.6,35.9],[40,63.9,36.4],[60,110,37.1],[80,169,38],[100,246,39.2]];function sol(t,k=0){for(let j=1;j<table.length;j++){let a=table[j-1],b=table[j];if(t<=b[0])return a[k+1]+(b[k+1]-a[k+1])*(t-a[0])/20}return table[5][k+1]}function rho(c){return 1+.0038*c+.000008*c*c}function save(){n().h=$('hyp').value;n().c=$('con').value;try{localStorage.setItem('scienceLabV1',JSON.stringify(notes))}catch{}}function choose(j){save();i=j;render()}function set(k,v){s()[k]=+v;if(i===1)s().m=s().b=false;if(i===3)s().test=false;if(i===4)s().stage=0;if(i===5)Object.assign(s(),{t:20,time:0,e:0});if(i===6)Object.assign(s(),{rw:0,ro:0,stage:0});if(i===7)s().f=0;render()}function slider(k,l,min,max,step,u){return `<label>${l}: <b>${s()[k]} ${u}</b><input type="range" min="${min}" max="${max}" step="${step}" value="${s()[k]}" onchange="set('${k}',this.value)"></label>`}function select(k,l,opts){return `<label>${l} <select onchange="set('${k}',this.value)">${opts.map((v,j)=>`<option value="${j}" ${s()[k]===j?'selected':''}>${v}</option>`).join('')}</select></label>`}let msg='';function act(a){let x=s();msg='';switch(a){case 'salt':x.salt++;break;case 'sand':x.sand++;break;case 'water':x.w+=5;break;case 'stir':x.d=Math.min(x.salt,x.w*.359);break;case 'filter':if(!x.w||x.d<x.salt){msg='소금을 먼저 모두 녹이세요.';break}x.rd+=x.sand;x.sand=0;break;case 'evap':if(x.w&&x.sand===0){x.rs+=x.salt;x.salt=0}else msg='혼합물이 남아 있습니다.';x.w=x.d=0;break;case 'weigh':x.m=true;break;case 'immerse':x.b=true;break;case 'pour':if(x.l.reduce((a,b)=>a+b.v,0)+x.v>150){msg='비커 용량 초과';break}if(x.l.length&&x.c>x.l.at(-1).c){let l=[...x.l,{c:x.c,v:x.v}],v=l.reduce((a,b)=>a+b.v,0),m=l.reduce((a,b)=>a+b.v*rho(b.c),0);x.l=[{v,c:l.reduce((a,b)=>a+b.v*rho(b.c)*b.c,0)/m}];msg='밀도가 높은 용액이 가라앉아 혼합됩니다.'}else x.l.push({c:x.c,v:x.v});break;case 'dissolve':x.test=true;break;case 'sat':x.stage=1;break;case 'cool':if(x.stage)x.stage=2;else msg='포화 용액부터 만드세요.';break;case 'heat':if(x.e>=80){msg='가열 중단';break}let bp=100+.512*1.9*(x.salt/58.44)/((100-x.e)/1000);x.time+=30;if(x.t<bp)x.t=Math.min(bp,x.t+8);else{x.e+=2;x.t=100+.512*1.9*(x.salt/58.44)/((100-x.e)/1000)}break;case 'mix':if(!x.rw&&!x.ro)x.stage=1;break;case 'settle':if(x.stage===1)x.stage=2;break;case 'drain':if(x.stage!==2){msg='먼저 층을 분리하세요.';break}if(x.rw<x.w)x.rw=Math.min(x.w,x.rw+5);else x.ro=Math.min(x.o,x.ro+5);break;case 'develop':x.f=Math.min(8,x.f+1);break}render()}
function rf(){return [[[.25,.55,.8],[.15,.4,.65]],[[.35,.72],[.22,.55]],[[.18,.45,.88],[.12,.32,.7]]][s().ink][s().sol]}
function values(){let x=s();switch(i){case 0:return ['물 '+x.w+'mL','녹은 소금 '+fmt(x.d)+'g','회수 소금 '+x.rs+'g','회수 모래 '+x.rd+'g'];case 1:return [metals[x.metal], '질량 '+(x.m?fmt(x.v*ds[x.metal])+'g':'미측정'),'처음 물 30mL','나중 물 '+(x.b?30+x.v+'mL':'미측정')];case 2:return ['농도 '+x.c+'%','밀도 '+fmt(rho(x.c))+'g/mL','층 '+x.l.length+'개'];case 3:return ['온도 '+x.t+'°C','용해량 '+(x.test?fmt(Math.min(x.a,sol(x.t,x.k)*x.w/100))+'g':'미측정')];case 4:return ['처음 '+x.h+'°C','냉각 '+x.t+'°C','결정 '+(x.stage===2?fmt((sol(x.h)-sol(x.t))*x.w/100)+'g':'미측정')];case 5:return ['소금 '+x.salt+'g','시간 '+x.time+'초','온도 '+fmt(x.t)+'°C','증발 '+x.e+'g'];case 6:return ['회수 물 '+x.rw+'mL','회수 기름 '+x.ro+'mL'];case 7:return ['용매 '+x.f+'cm',...rf().map((r,j)=>'색소 '+(j+1)+' '+fmt(r*x.f)+'cm')]}}
function record(){let x=s(),p=null,g='';if(i===1&&x.m&&x.b){p=[x.v,x.v*ds[x.metal]];g=metals[x.metal]}if(i===2){p=[x.c,rho(x.c)]}if(i===3&&x.test){p=[x.t,Math.min(x.a,sol(x.t,x.k)*x.w/100)];g=['질산칼륨','소금'][x.k]}if(i===4&&x.stage===2)p=[x.t,(sol(x.h)-sol(x.t))*x.w/100];if(i===5){p=[x.time,x.t];g='소금 '+x.salt+'g'}n().r.push({text:values().join(' / '),p,g});save();render()}function reset(){states[i]=defaults()[i];msg='';render()}function done(){n().done=true;save();render()}
function txt(x,y,t){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="12" fill="#23434b">${t}</text>`}function cup(x,y,w,h,level,col='#8acde7'){let a=Math.min(1,Math.max(0,level))*h;return `<rect x="${x+2}" y="${y+h-a}" width="${w-4}" height="${a}" fill="${col}" opacity=".75"/><path d="M${x} ${y}V${y+h}H${x+w}V${y}" fill="none" stroke="#648895" stroke-width="2"/>`}function dots(x,y,w,h,count,col){return Array.from({length:Math.min(100,Math.ceil(Math.max(0,count)))},(_,j)=>`<circle cx="${x+j*23%w}" cy="${y+j*17%h}" r="2.5" fill="${col}"/>`).join('')}
function scene(){let x=s(),a='';switch(i){case 0:a=cup(35,30,120,150,x.w/100)+dots(43,160,100,16,x.sand*8,'#ae8851')+dots(43,165,100,12,(x.salt-x.d)*8,'#bfc8ce')+txt(95,205,'혼합물')+`<ellipse cx="265" cy="70" rx="65" ry="18" fill="#dce5e9"/><ellipse cx="265" cy="150" rx="65" ry="18" fill="#dce5e9"/>`+dots(220,62,90,14,x.rd*8,'#ae8851')+dots(220,142,90,14,x.rs*8,'white')+txt(265,100,'모래 '+x.rd+'g')+txt(265,180,'소금 '+x.rs+'g');break;case 1:a=`<rect x="20" y="145" width="140" height="45" rx="8" fill="#a9bac4"/>`+txt(90,173,x.m?fmt(x.v*ds[x.metal])+'g':'0g')+cup(240,20,65,170,(30+(x.b?x.v:0))/50)+`<rect x="${x.b?257:70}" y="${x.b?155:110}" width="30" height="30" fill="${['#b8c4cc','#77838c','#b8784f','#9ba9b5'][x.metal]}"/>`+txt(272,207,(30+(x.b?x.v:0))+'mL');break;case 2:{let y=190;for(let l of x.l){let h=l.v;a+=`<rect x="102" y="${y-h}" width="156" height="${h}" fill="hsl(${205-l.c*3},65%,${80-l.c*.4}%)"/>`+txt(180,y-h/2,fmt(l.c)+'%');y-=h}a+=cup(100,20,160,170,0);break}case 3:a=cup(100,25,160,160,.75)+dots(110,165,140,15,(x.test?Math.max(0,x.a-sol(x.t,x.k)*x.w/100):x.a)*2,'#9caeb9')+txt(180,15,x.t+'°C');break;case 4:a=cup(100,25,160,160,.75)+dots(110,155,140,25,x.stage===2?(sol(x.h)-sol(x.t))*x.w/100:0,'#a0b2be')+txt(180,15,(x.stage===2?x.t:x.h)+'°C');break;case 5:a=cup(90,20,180,155,(100-x.e)/150)+`<rect x="75" y="180" width="210" height="25" rx="6" fill="#8c9da8"/>`+txt(180,198,fmt(x.t)+'°C')+(x.t>=100?dots(105,90,150,75,30,'white'):'');break;case 6:{let w=x.w-x.rw,o=x.o-x.ro;a=`<defs><clipPath id="sep"><path d="M165 15H195V35Q275 80 240 115L187 170V190H173V170L120 115Q85 80 165 35Z"/></clipPath></defs><g clip-path="url(#sep)"><rect x="90" y="${170-w}" width="180" height="${w}" fill="#8acde7"/><rect x="90" y="${170-w-o}" width="180" height="${o}" fill="#e8c15c"/>${x.stage===1?dots(130,65,100,80,70,'#e8c15c'):''}</g><path d="M165 15H195V35Q275 80 240 115L187 170V190H173V170L120 115Q85 80 165 35Z" fill="none" stroke="#648895" stroke-width="2"/>`+txt(180,210,'분별깔때기');break}case 7:a=`<rect x="110" y="15" width="140" height="190" fill="#eeeadd"/><path d="M110 190H250 M110 ${190-x.f*20}H250" stroke="#658c9d" stroke-dasharray="4 3"/>`+rf().map((r,j)=>`<ellipse cx="180" cy="${190-x.f*20*r}" rx="18" ry="6" fill="${['#e3b73c','#c65372','#4c80b7'][j]}" opacity=".75"/>`).join('');break}return a}
function render(){let x=s(),c='',a=[];const b=(label,key)=>[label,key];switch(i){case 0:a=[b('소금 +1g','salt'),b('모래 +1g','sand'),b('물 +5mL','water'),b('젓기','stir'),b('여과','filter'),b('증발','evap')];break;case 1:c=select('metal','금속',metals)+slider('v','부피',2,20,1,'cm³');a=[b('질량 측정','weigh'),b('물에 넣기','immerse')];break;case 2:c=slider('c','농도',0,50,5,'%')+slider('v','부피',10,50,10,'mL');a=[b('천천히 붓기','pour')];break;case 3:c=select('k','용질',['질산칼륨','소금'])+slider('t','온도',0,100,10,'°C')+slider('w','물',50,150,25,'g')+slider('a','용질',10,250,10,'g');a=[b('용해','dissolve')];break;case 4:c=slider('h','처음 온도',40,100,10,'°C')+slider('t','냉각 온도',0,40,10,'°C')+slider('w','물',50,150,25,'g');a=[b('포화 용액 만들기','sat'),b('냉각','cool')];break;case 5:c=slider('salt','물 100g에 소금',0,20,5,'g');a=[b('30초 가열','heat')];break;case 6:c=slider('w','물',20,80,10,'mL')+slider('o','기름',20,60,10,'mL');a=[b('혼합','mix'),b('가만히 두기','settle'),b('5mL 배출','drain')];break;case 7:c=select('ink','색소',['A','B','C'])+select('sol','가상 용매',['1','2']);a=[b('1cm 전개','develop')];break}$('nav').innerHTML=names.map((v,j)=>`<button class="${i===j?'active':''}" onclick="choose(${j})">${j+1}. ${v}${notes[j].done?' ✓':''}</button>`).join('');$('progress').textContent=notes.filter(v=>v.done).length+'/8 완료';$('title').textContent=names[i];$('mission').textContent=missions[i];$('hyp').value=n().h;$('con').value=n().c;$('hint').textContent=hints[i];$('principle').textContent=principles[i];$('controls').innerHTML=c;$('actions').innerHTML=a.map(([l,k])=>`<button class="action" onclick="act('${k}')">${l}</button>`).join('');$('result').textContent=values().join(' · ')+(msg?' — '+msg:'');$('scene').innerHTML=scene();$('records').innerHTML=n().r.map((r,j)=>`<tr><td>${j+1}</td><td>${r.text}</td></tr>`).join('');let pts=n().r.filter(r=>r.p),xm=Math.max(1,...pts.map(r=>r.p[0])),ym=Math.max(1,...pts.map(r=>r.p[1]));$('graph').style.display=pts.length?'block':'none';$('graph').innerHTML=`<path d="M40 20V160H340" fill="none" stroke="#78909c"/>`+txt(190,190,['','부피(cm³)','농도(%)','온도(°C)','냉각 온도(°C)','시간(s)'][i]||'')+txt(40,12,['','질량(g)','밀도','용해량(g)','결정(g)','온도(°C)'][i]||'')+txt(340,175,fmt(xm))+txt(20,25,fmt(ym))+pts.map(r=>`<circle cx="${40+r.p[0]/xm*300}" cy="${160-r.p[1]/ym*140}" r="4" fill="#287b89"><title>${r.g} ${r.p.join(', ')}</title></circle>`).join('')}
render();
(function(){let root=$('extraDesign'),title=$('title'),spec=[["분리 방법", "혼합물의 초기 조성", "분리된 물질의 종류와 양", "물의 양"], ["금속의 부피", "금속의 종류", "질량", "측정 방법"], ["설탕물 농도", "용액 부피", "밀도", "온도"], ["물의 온도", "용질 종류", "녹은 용질의 양", "물의 질량"], ["냉각 온도", "처음 온도", "결정의 질량", "물의 질량"], ["가열 시간", "소금의 양", "용액 온도", "가열 세기"], ["배출량", "물과 기름의 초기 양", "배출된 액체 종류", "분리 방법"], ["용매 종류", "색소 종류", "색소 이동 거리", "전개 거리"]];let last=-1;function load(){if(last===i)return;last=i;let [a,b,c,...extras]=spec[i];designChoices(root,'properties:'+i,a,b,c,$('hyp'),extras)}new MutationObserver(load).observe(title,{childList:true,subtree:true});load()})();
</script></html>
