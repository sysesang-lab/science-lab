<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기하 작도 실험실</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#183047;font:15px system-ui,sans-serif}header{padding:22px 30px;background:#163b50;color:white}h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#c9e0e9}main{display:grid;grid-template-columns:235px minmax(350px,1fr) 300px;gap:14px;padding:16px}aside,article{background:white;border:1px solid #dce5eb;border-radius:12px;padding:15px}button,select{font:inherit;border:1px solid #cbd9e2;background:white;color:#183047;border-radius:7px;padding:8px;cursor:pointer}button:hover,button.active{background:#d9efea;border-color:#168574}nav button{display:block;width:100%;text-align:left;margin:5px 0;font-size:13px}h3{font-size:15px;margin:16px 0 8px}#tools{display:flex;flex-wrap:wrap;gap:6px}svg{width:100%;height:auto;display:block;background:#fcfdff;border:1px solid #dce5eb;border-radius:8px;touch-action:none;margin:12px 0}#status{min-height:42px;color:#08796b}p,li{line-height:1.65}#hint{background:#eef6f5;padding:12px;border-radius:8px}small{color:#64748b}#result{white-space:pre-line} @media(max-width:1000px){main{grid-template-columns:180px 1fr}main>aside:last-child{grid-column:1/-1}}@media(max-width:650px){main{display:flex;flex-direction:column}nav{max-height:180px;overflow:auto}}

</style><header><a href="index.html" style="color:white;display:inline-block;margin-bottom:10px">← 전체 실험실</a><h1>Geometry Lab · 기하 작도 실험실</h1><p>자와 컴퍼스로 발견하는 중등 기하</p></header><main><aside><b>실습 목록</b><nav id="nav"></nav></aside><article><div id="tools"></div><svg id="board" viewBox="0 0 800 560"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e6edf2"/></pattern></defs><rect width="800" height="560" fill="url(#grid)"/><g id="drawing"/></svg><div id="status"></div><small>교점 도구로 두 도형을 차례로 선택하세요. 기존 점 근처를 클릭하면 정확히 연결됩니다.</small></article><aside><select id="mode"><option>따라 하기</option><option>도전 모드</option><option>자유 작도</option></select><h2 id="title"></h2><p id="goal"></p><h3>작도 방법</h3><div id="hint"></div><button id="next">다음 힌트</button><h3>결과 확인</h3><button id="check">작도 결과 검증</button><p id="result"></p><h3>원리 탐구</h3><p id="question"></p><button id="answer">해설 보기</button><p id="explain" hidden></p></aside></main><script>
const $=id=>document.getElementById(id), P=(x,y)=>({x,y}), D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), sub=(a,b)=>P(a.x-b.x,a.y-b.y), dot=(a,b)=>a.x*b.x+a.y*b.y, cross=(a,b)=>a.x*b.y-a.y*b.x;
const A=P(230,340),B=P(550,340),C=P(370,125), T=[A,B,C];
const lessons=[
['기초','같은 길이의 선분','AB와 같은 길이의 새 선분을 작도하세요.',['컴퍼스 길이 복사 도구로 A, B를 선택합니다.','새 중심점을 선택하여 원을 그립니다.','중심에서 원 위의 점까지 선분을 연결합니다.'],'원의 반지름은 왜 모두 같을까요?','한 원의 모든 점은 중심에서 같은 거리에 있습니다.','copy'],
['기초','수직이등분선','AB의 수직이등분선을 작도하세요.',['A를 중심으로 AB를 반지름으로 하는 원을 그립니다.','B를 중심으로 BA를 반지름으로 하는 원을 그립니다.','두 원의 교점을 표시하고 직선으로 연결합니다.'],'두 교점은 왜 A와 B에서 같은 거리에 있나요?','두 원의 반지름이 같으므로 교점은 A와 B에서 등거리입니다.','bisect'],
['기초','각의 이등분선','각 BAC를 이등분하세요.',['A 중심의 원을 그려 두 변과 만나는 점을 표시합니다.','두 교점을 중심으로 같은 반지름의 원을 그립니다.','두 원의 교점 중 각 내부의 점과 A를 연결합니다.'],'두 각의 크기가 같은 이유는?','두 삼각형의 세 변이 각각 같아 SSS 합동입니다.','angle'],
['기초','수선','C를 지나 AB에 수직인 직선을 작도하세요.',['C 중심의 충분히 큰 원을 그립니다.','AB와 원의 두 교점을 표시합니다.','두 교점의 수직이등분선을 작도합니다.'],'왜 수선이 C를 지나나요?','C는 두 교점에서 등거리이므로 수직이등분선 위에 있습니다.','perp'],
['기초','평행선','C를 지나 AB에 평행한 직선을 작도하세요.',['C에서 AB에 수선을 작도합니다.','C에서 방금 만든 수선에 다시 수선을 작도합니다.'],'두 번 수직이면 왜 평행일까요?','같은 직선에 수직인 두 직선은 평행합니다.','parallel'],
['삼각형','SSS 작도','세 변의 길이가 320, 260, 240인 삼각형을 작도하세요.',['AB를 밑변으로 사용합니다.','A 중심 반지름 260, B 중심 반지름 240인 원을 그립니다. (제공된 길이 표본을 복사하세요.)','교점과 A, B를 선분으로 연결합니다.'],'세 변으로 삼각형이 결정되는 조건은?','가장 긴 변이 나머지 두 변의 합보다 작아야 합니다.','sss'],
['삼각형','SAS 작도','AB와 AC 및 끼인각 BAC가 같은 삼각형을 다른 위치에 작도하세요.',['새 밑변을 AB와 같은 길이로 작도합니다.','각 복사 방법으로 각 BAC를 옮깁니다.','AC 길이를 복사해 새 반직선 위에 꼭짓점을 정합니다.'],'왜 끼인각이어야 할까요?','두 변 사이의 각을 고정해야 삼각형의 모양이 하나로 결정됩니다.','manual'],
['삼각형','ASA 작도','AB와 양 끝 각이 같은 삼각형을 복사하세요.',['AB 길이를 복사합니다.','A와 B의 각을 각각 복사합니다.','두 반직선의 교점을 꼭짓점으로 정합니다.'],'두 각과 한 변은 왜 충분할까요?','두 각이 방향을 결정하고 그 사이의 변이 크기를 결정합니다.','manual'],
['심화','외심과 외접원','삼각형의 외심을 찾아 외접원을 그리세요.',['AB의 수직이등분선을 작도합니다.','AC의 수직이등분선을 작도합니다.','두 직선의 교점을 중심으로 A를 지나는 원을 그립니다.'],'둔각삼각형의 외심은 어디에 있나요?','둔각삼각형의 외심은 삼각형 밖에 있습니다.','circum'],
['심화','내심과 내접원','삼각형의 내심과 내접원을 작도하세요.',['A와 B의 각의 이등분선을 작도합니다.','두 직선의 교점을 표시합니다.','내심에서 AB에 수선을 내려 그 거리를 반지름으로 원을 그립니다.'],'내심은 왜 세 변에서 등거리인가요?','각의 이등분선 위의 점은 각의 두 변에서 등거리입니다.','incenter'],
['심화','무게중심','삼각형의 무게중심을 작도하세요.',['AB와 AC의 중점을 수직이등분선으로 구합니다.','각 중점과 마주 보는 꼭짓점을 연결합니다.','두 중선의 교점을 표시합니다.'],'중선은 어떤 비율로 나뉘나요?','꼭짓점에서 무게중심까지와 무게중심에서 중점까지의 비는 2:1입니다.','centroid'],
['심화','수심','삼각형의 수심을 작도하세요.',['C에서 AB에 수선을 작도합니다.','B에서 AC에 수선을 작도합니다.','두 수선의 교점을 표시합니다.'],'세 번째 수선도 같은 점을 지날까요?','세 높이의 직선은 한 점인 수심에서 만납니다.','ortho'],
['심화','방심과 방접원','A에 대응하는 방심을 작도하세요.',['A의 내각 이등분선을 작도합니다.','B의 외각 이등분선을 작도합니다.','교점을 표시하고 한 변의 직선에 내린 수선 길이로 원을 그립니다.'],'방심은 몇 개일까요?','각 삼각형에는 세 방심이 있습니다.','manual'],
['심화','정삼각형과 60°','AB를 한 변으로 하는 정삼각형을 작도하세요.',['A와 B 중심으로 반지름 AB인 원을 각각 그립니다.','두 원의 교점 하나를 선택합니다.','교점과 A, B를 연결합니다.'],'세 각이 모두 60°인 이유는?','세 변이 같아 세 각도 같고 내각의 합은 180°입니다.','equilateral'],
['심화','정사각형','AB를 한 변으로 하는 정사각형을 작도하세요.',['A와 B에서 AB에 수직인 직선을 작도합니다.','AB 길이를 복사하여 같은 쪽에 꼭짓점을 정합니다.','새 꼭짓점을 연결합니다.'],'네 변이 같기만 하면 정사각형일까요?','아닙니다. 네 각도 직각이어야 합니다.','manual']];
let idx=0,objects=[],history=[],pending=[],tool='점',step=0,serial=0;const tools=['점','선분','직선','반직선','원','길이 복사','교점','지우개','실행 취소','초기화','길이 확인'];
function save(){history.push(JSON.stringify([objects,serial]))}function point(p,label){let old=objects.find(o=>o.type==='point'&&D(o.p,p)<.01);if(old)return old.p;objects.push({type:'point',p,label:label||'P'+(++serial)});return p}function line(a,b,type='segment'){if(D(a,b)>0.01)objects.push({type,a,b})}function circle(a,r){if(r>.01)objects.push({type:'circle',a,r})}function reset(){objects=[];history=[];pending=[];serial=0;step=0;if($('mode').value!=='자유 작도'){point(A,'A');point(B,'B');line(A,B);if(!['copy','bisect','sss','equilateral'].includes(lessons[idx][6])){point(C,'C');if(!['perp','parallel'].includes(lessons[idx][6])){line(A,C);line(B,C)}}if(lessons[idx][6]==='sss'){point(P(80,480),'D');point(P(340,480),'E');line(P(80,480),P(340,480));point(P(450,480),'F');point(P(690,480),'G');line(P(450,480),P(690,480))}}render();hint();$('result').textContent='';$('explain').hidden=true}
function select(i){idx=i;$('title').textContent=lessons[i][1];$('goal').textContent=lessons[i][2];$('question').textContent=lessons[i][4];$('explain').textContent=lessons[i][5];document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));reset()}
function hint(){let h=lessons[idx][3];$('hint').textContent=$('mode').value==='자유 작도'?'도구를 자유롭게 사용하세요.':$('mode').value==='도전 모드'&&step===0?'먼저 스스로 작도해 보세요.':h.slice(0,$('mode').value==='도전 모드'?step:step+1).map((s,i)=>`${i+1}. ${s}`).join('\n');$('hint').style.whiteSpace='pre-line'}
let group='';lessons.forEach((l,i)=>{if(group!==l[0]){$('nav').insertAdjacentHTML('beforeend',`<h3>${l[0]}</h3>`);group=l[0]}let b=document.createElement('button');b.textContent=l[1];b.onclick=()=>select(i);$('nav').append(b)});tools.forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(t==='초기화')return reset();if(t==='실행 취소'){if(history.length)[objects,serial]=JSON.parse(history.pop());pending=[];return render()}tool=t;pending=[];render()};$('tools').append(b)});
function isLine(o){return ['segment','line','ray'].includes(o.type)}function range(o,t){return o.type==='line'||(o.type==='ray'?t>=-1e-8:t>=-1e-8&&t<=1+1e-8)}function dist(o,p){if(o.type==='point')return D(o.p,p);if(o.type==='circle')return Math.abs(D(o.a,p)-o.r);let v=sub(o.b,o.a),t=dot(sub(p,o.a),v)/dot(v,v);if(o.type==='segment')t=Math.max(0,Math.min(1,t));if(o.type==='ray')t=Math.max(0,t);return D(p,P(o.a.x+t*v.x,o.a.y+t*v.y))}
function intersections(a,b){if(isLine(a)&&isLine(b)){let u=sub(a.b,a.a),v=sub(b.b,b.a),w=sub(b.a,a.a),d=cross(u,v);if(Math.abs(d)<1e-8)return [];let t=cross(w,v)/d,s=cross(w,u)/d;return range(a,t)&&range(b,s)?[P(a.a.x+t*u.x,a.a.y+t*u.y)]:[]}if(a.type==='circle'&&isLine(b))return intersections(b,a);if(isLine(a)&&b.type==='circle'){let v=sub(a.b,a.a),w=sub(a.a,b.a),aa=dot(v,v),bb=2*dot(v,w),cc=dot(w,w)-b.r*b.r,disc=bb*bb-4*aa*cc;if(disc< -1e-8)return [];return [-1,1].map(s=>(-bb+s*Math.sqrt(Math.max(0,disc)))/(2*aa)).filter(t=>range(a,t)).map(t=>P(a.a.x+t*v.x,a.a.y+t*v.y))}if(a.type==='circle'&&b.type==='circle'){let d=D(a.a,b.a);if(d<1e-8||d>a.r+b.r||d<Math.abs(a.r-b.r))return [];let x=(a.r*a.r-b.r*b.r+d*d)/(2*d),h=Math.sqrt(Math.max(0,a.r*a.r-x*x)),u=sub(b.a,a.a);return [-1,1].map(s=>P(a.a.x+(x*u.x-s*h*u.y)/d,a.a.y+(x*u.y+s*h*u.x)/d))}return []}
function render(){let out='';for(let o of objects.filter(o=>o.type!=='point')){let color=pending.includes(o)?'#e78b27':o.type==='circle'?'#7099bc':'#254e69';if(o.type==='circle')out+=`<circle cx="${o.a.x}" cy="${o.a.y}" r="${o.r}" fill="none" stroke="${color}" stroke-width="1.6"/>`;else{let v=sub(o.b,o.a),k=2000/D(o.a,o.b),a=o.type==='line'?P(o.a.x-v.x*k,o.a.y-v.y*k):o.a,b=o.type==='segment'?o.b:P(o.a.x+v.x*k,o.a.y+v.y*k);out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="2"/>`}}for(let o of objects.filter(o=>o.type==='point'))out+=`<circle cx="${o.p.x}" cy="${o.p.y}" r="4.5" fill="${pending.includes(o.p)?'#e78b27':'#08796b'}"/><text x="${o.p.x+8}" y="${o.p.y-8}" font-size="15" fill="#183047">${o.label}</text>`;$('drawing').innerHTML=out;document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('active',b.textContent===tool));let messages={'점':'점을 놓을 위치를 클릭하세요.','원':pending.length?'반지름을 정할 점을 선택하세요.':'원의 중심을 선택하세요.','길이 복사':['복사할 길이의 첫 점','복사할 길이의 둘째 점','새 원의 중심'][pending.length]+'을 선택하세요.','교점':pending.length?'두 번째 도형을 선택하세요.':'첫 번째 도형을 선택하세요.','지우개':'지울 도형 또는 점을 클릭하세요.'};$('status').textContent=messages[tool]|| (pending.length?'두 번째 점을 선택하세요.':'첫 번째 점을 선택하세요.')}
$('board').onclick=e=>{let svg=$('board'),q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),p=P(q.x,q.y),tol=12;let nearest=(arr)=>arr.map(o=>[o,dist(o,p)]).sort((a,b)=>a[1]-b[1]).find(x=>x[1]<tol)?.[0];if(tool==='교점'||tool==='지우개'){let o=nearest(objects.filter(o=>tool==='지우개'||o.type!=='point').filter(o=>!pending.includes(o)));if(!o)return;if(tool==='지우개'){save();objects=objects.filter(x=>x!==o);pending=[]}else if(!pending.length)pending.push(o);else{let pts=intersections(pending[0],o);save();pts.forEach(p=>point(p));pending=[];render();if(!pts.length)$('status').textContent='교점이 없습니다.';return}return render()}let existing=nearest(objects.filter(o=>o.type==='point'));if(existing)p=existing.p;else{let o=nearest(objects.filter(o=>o.type!=='point'));if(o){if(o.type==='circle'){let d=D(o.a,p);if(d)p=P(o.a.x+(p.x-o.a.x)*o.r/d,o.a.y+(p.y-o.a.y)*o.r/d)}else{let v=sub(o.b,o.a),t=dot(sub(p,o.a),v)/dot(v,v);if(o.type==='segment')t=Math.max(0,Math.min(1,t));if(o.type==='ray')t=Math.max(0,t);p=P(o.a.x+t*v.x,o.a.y+t*v.y)}}}if(tool==='길이 확인'){pending.push(p);if(pending.length===2){let d=D(...pending);pending=[];render();$('status').textContent='측정 길이: '+d.toFixed(2)+' (화면 단위)';return}return render()}save();p=point(p);if(tool==='점')return render();pending.push(p);let n=tool==='길이 복사'?3:2;if(pending.length===n){let [a,b,c]=pending;if(tool==='원')circle(a,D(a,b));else if(tool==='길이 복사')circle(c,D(a,b));else line(a,b,{'선분':'segment','직선':'line','반직선':'ray'}[tool]);pending=[]}render()};
function on(o,p){return dist(o,p)<2}function verify(){let k=lessons[idx][6],ls=objects.filter(isLine),cs=objects.filter(o=>o.type==='circle'),ps=objects.filter(o=>o.type==='point').map(o=>o.p),mid=P((A.x+B.x)/2,A.y),v=sub(B,A),perp=o=>Math.abs(dot(sub(o.b,o.a),v))/(D(o.a,o.b)*D(A,B))<.01,parallel=o=>Math.abs(cross(sub(o.b,o.a),v))/(D(o.a,o.b)*D(A,B))<.01;let ok=false;switch(k){case 'copy':ok=ls.some(o=>Math.abs(D(o.a,o.b)-D(A,B))<2&&!(on(o,A)&&on(o,B)));break;case 'bisect':ok=ls.some(o=>perp(o)&&on(o,mid));break;case 'perp':ok=ls.some(o=>perp(o)&&on(o,C));break;case 'parallel':ok=ls.some(o=>parallel(o)&&on(o,C));break;case 'angle':{let u=sub(B,A),w=sub(C,A),dir=P(u.x/D(A,B)+w.x/D(A,C),u.y/D(A,B)+w.y/D(A,C));ok=ls.some(o=>on(o,A)&&Math.abs(cross(sub(o.b,o.a),dir))/(D(o.a,o.b)*Math.hypot(dir.x,dir.y))<.01);break}case 'circum':ok=cs.some(o=>T.every(p=>on(o,p)));break;case 'incenter':{let a=D(B,C),b=D(A,C),c=D(A,B),p=P((a*A.x+b*B.x+c*C.x)/(a+b+c),(a*A.y+b*B.y+c*C.y)/(a+b+c));ok=cs.some(o=>D(o.a,p)<2&&Math.abs(o.r-dist({type:'line',a:A,b:B},p))<2);break}case 'centroid':case 'ortho':{let p=k==='centroid'?P((A.x+B.x+C.x)/3,(A.y+B.y+C.y)/3):P(C.x,A.y+(C.x-B.x)*(C.x-A.x)/(A.y-C.y));ok=ps.some(q=>D(p,q)<2)&&ls.filter(o=>on(o,p)).length>=2;break}case 'sss':case 'equilateral':ok=ps.some(p=>Math.abs(D(p,A)-(k==='sss'?260:D(A,B)))<2&&Math.abs(D(p,B)-(k==='sss'?240:D(A,B)))<2&&ls.some(o=>on(o,p)&&on(o,A))&&ls.some(o=>on(o,p)&&on(o,B)));break;default:$('result').textContent='이 실습은 자동 검증 대신 해설과 길이 확인 도구로 직접 확인하세요.';return} $('result').textContent=ok?'✓ 목표 도형의 기하 조건을 만족합니다. 작도 과정도 설명해 보세요.':'아직 목표 조건을 만족하지 않습니다. 힌트를 확인해 보세요.'}
$('check').onclick=verify;$('next').onclick=()=>{step=Math.min(step+1,lessons[idx][3].length);hint()};$('answer').onclick=()=>$('explain').hidden=!$('explain').hidden;$('mode').onchange=reset;select(0);
