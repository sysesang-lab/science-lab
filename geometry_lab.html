['삼각형','SAS 작도','AB와 AC 및 끼인각 BAC가 같은 삼각형을 다른 위치에 작도하세요.',['새 밑변을 AB와 같은 길이로 작도합니다.','각 복사 방법으로 각 BAC를 옮깁니다.','AC 길이를 복사해 새 반직선 위에 꼭짓점을 정합니다.'],'왜 끼인각이어야 할까요?','두 변 사이의 각을 고정해야 삼각형의 모양이 하나로 결정됩니다.','manual'],

['심화','무게중심','삼각형의 무게중심을 작도하세요.',['AB와 AC의 중점을 수직이등분선으로 구합니다.','각 중점과 마주 보는 꼭짓점을 연결합니다.','두 중선의 교점을 표시합니다.'],'중선은 어떤 비율로 나뉘나요?','꼭짓점에서 무게중심까지와 무게중심에서 중점까지의 비는 2:1입니다.','centroid'],

let cursor=null,placed=null,animation=0,animating=false,animatedObject=null; function stopAnimation(){cancelAnimationFrame(animation);animating=false;animatedObject=null;}let idx=0,objects=[],history=[],pending=[],tool='점',step=0,serial=0;const tools=['점','선분','직선','반직선','원','길이 복사','교점','지우개','실행 취소','초기화'];
function save(){history.push(JSON.stringify([objects,serial]))}function point(p,label){let old=objects.find(o=>o.type==='point'&&D(o.p,p)<.01);if(old)return old.p;objects.push({type:'point',p,label:label||'P'+(++serial)});return p}function line(a,b,type='segment'){if(D(a,b)>0.01)objects.push({type,a,b})}function circle(a,r){if(r>.01)objects.push({type:'circle',a,r})}function reset(){setView(0,0,800,560);stopAnimation();cursor=null;placed=null;objects=[];history=[];pending=[];serial=0;step=0;if($('mode').value!=='자유 작도'){point(A,'A');point(B,'B');line(A,B);if(!['copy','bisect','sss','equilateral'].includes(lessons[idx][6])){point(C,'C');if(!['perp','parallel'].includes(lessons[idx][6])){line(A,C);line(B,C)}}if(lessons[idx][6]==='sss'){point(P(80,480),'D');point(P(340,480),'E');line(P(80,480),P(340,480));point(P(450,480),'F');point(P(690,480),'G');line(P(450,480),P(690,480))}}render();hint();$('result').textContent='';$('explain').hidden=true}
function select(i){idx=i;$('title').textContent=lessons[i][1];$('goal').textContent=lessons[i][2];$('question').textContent=lessons[i][4];$('explain').textContent=lessons[i][5];document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));reset()}
function hint(){let h=lessons[idx][3];$('hint').textContent=$('mode').value==='자유 작도'?'도구를 자유롭게 사용하세요.':$('mode').value==='도전 모드'&&step===0?'먼저 스스로 작도해 보세요.':h.slice(0,$('mode').value==='도전 모드'?step:step+1).map((s,i)=>`${i+1}. ${s}`).join('\n');$('hint').style.whiteSpace='pre-line'}
let group='';lessons.forEach((l,i)=>{if(group!==l[0]){$('nav').insertAdjacentHTML('beforeend',`<h3>${l[0]}</h3>`);group=l[0]}let b=document.createElement('button');b.textContent=l[1];b.onclick=()=>select(i);$('nav').append(b)});tools.forEach(t=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{stopAnimation();if(t==='초기화')return reset();if(t==='실행 취소'){if(history.length)[objects,serial]=JSON.parse(history.pop());pending=[];placed=null;return render()}tool=t;pending=[];cursor=null;placed=null;render()};$('tools').append(b)});
function isLine(o){return ['segment','line','ray'].includes(o.type)}function range(o,t){return o.type==='line'||(o.type==='ray'?t>=-1e-8:t>=-1e-8&&t<=1+1e-8)}function dist(o,p){if(o.type==='point')return D(o.p,p);if(o.type==='circle')return Math.abs(D(o.a,p)-o.r);let v=sub(o.b,o.a),t=dot(sub(p,o.a),v)/dot(v,v);if(o.type==='segment')t=Math.max(0,Math.min(1,t));if(o.type==='ray')t=Math.max(0,t);return D(p,P(o.a.x+t*v.x,o.a.y+t*v.y))}
function intersections(a,b){if(isLine(a)&&isLine(b)){let u=sub(a.b,a.a),v=sub(b.b,b.a),w=sub(b.a,a.a),d=cross(u,v);if(Math.abs(d)<1e-8)return [];let t=cross(w,v)/d,s=cross(w,u)/d;return range(a,t)&&range(b,s)?[P(a.a.x+t*u.x,a.a.y+t*u.y)]:[]}if(a.type==='circle'&&isLine(b))return intersections(b,a);if(isLine(a)&&b.type==='circle'){let v=sub(a.b,a.a),w=sub(a.a,b.a),aa=dot(v,v),bb=2*dot(v,w),cc=dot(w,w)-b.r*b.r,disc=bb*bb-4*aa*cc;if(disc< -1e-8)return [];return [-1,1].map(s=>(-bb+s*Math.sqrt(Math.max(0,disc)))/(2*aa)).filter(t=>range(a,t)).map(t=>P(a.a.x+t*v.x,a.a.y+t*v.y))}if(a.type==='circle'&&b.type==='circle'){let d=D(a.a,b.a);if(d<1e-8||d>a.r+b.r||d<Math.abs(a.r-b.r))return [];let x=(a.r*a.r-b.r*b.r+d*d)/(2*d),h=Math.sqrt(Math.max(0,a.r*a.r-x*x)),u=sub(b.a,a.a);return [-1,1].map(s=>P(a.a.x+(x*u.x-s*h*u.y)/d,a.a.y+(x*u.y+s*h*u.x)/d))}return []}
function render(){let out='';for(let o of objects.filter(o=>o.type!=='point')){let color=pending.includes(o)?'#e78b27':o.type==='circle'?'#7099bc':'#254e69';if(o===animatedObject)continue;if(o.type==='circle')out+=`<circle cx="${o.a.x}" cy="${o.a.y}" r="${o.r}" fill="none" stroke="${color}" stroke-width="1.6"/>`;else{let v=sub(o.b,o.a),k=2000/D(o.a,o.b),a=o.type==='line'?P(o.a.x-v.x*k,o.a.y-v.y*k):o.a,b=o.type==='segment'?o.b:P(o.a.x+v.x*k,o.a.y+v.y*k);out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="2"/>`}}for(let o of objects.filter(o=>o.type==='point'))out+=`<circle cx="${o.p.x}" cy="${o.p.y}" r="4.5" fill="${pending.includes(o.p)?'#e78b27':'#08796b'}"/><text x="${o.p.x+8}" y="${o.p.y-8}" font-size="15" fill="#183047">${o.label}</text>`;$('drawing').innerHTML=out;drawCompass();document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('active',b.textContent===tool));let messages={'점':'점을 놓을 위치를 클릭하세요.','원':pending.length?'반지름을 정할 점을 선택하세요.':'원의 중심을 선택하세요.','길이 복사':['복사할 길이의 첫 점','복사할 길이의 둘째 점','새 원의 중심 (같은 간격으로 반복 작도 가능)'][pending.length]+'을 선택하세요.','교점':pending.length?'두 번째 도형을 선택하세요.':'첫 번째 도형을 선택하세요.','지우개':'지울 도형 또는 점을 클릭하세요.'};$('status').textContent=messages[tool]|| (pending.length?'두 번째 점을 선택하세요.':'첫 번째 점을 선택하세요.')}
function ruler(a,b){let d=D(a,b),len=Math.max(150,d+70),t=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;return `<g transform="translate(${a.x} ${a.y}) rotate(${t})"><rect x="-35" y="1" width="${len}" height="38" rx="3" fill="#9bc9cb" fill-opacity=".55" stroke="#68999e"/><path d="M-35 1H${len-35}" stroke="#426b70" stroke-width="1.4"/></g>`}
