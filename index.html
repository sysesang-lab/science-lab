<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Science Lab</title><style>body{font:16px system-ui;background:#eef4f5;color:#23434b;max-width:850px;margin:auto;padding:20px}header,section{background:white;padding:24px;border-radius:16px;margin:14px 0}header{background:#174650;color:white}a{display:block;padding:18px;margin:10px 0;background:#e4f1f0;border-radius:10px;color:#174650;text-decoration:none}small{color:#56727a}</style><header>MY SCIENCE LAB<h1>중등 과학 실험실</h1>물리 · 화학 탐구 | 83개 활동</header><main id="menu"></main><small>학년 배치는 기존 설계안 기준이며 교과서에 따라 다를 수 있습니다. 기체의 성질은 장치 조립형 실험으로 개선되었습니다. 다른 단원은 기존 탐구 모형입니다.</small><script src="data.js"></script><script>const grades=[['중학교 1학년',['힘의 작용','기체의 성질','물질의 상태 변화','열과 우리 생활']],['중학교 2학년',['물질의 특성','물질의 구성','빛과 파동','전기와 자기']],['중학교 3학년',['화학 반응의 규칙','운동과 에너지','에너지 전환과 보존']]];document.getElementById('menu').innerHTML=grades.map(([g,us])=>'<section><h2>'+g+'</h2>'+us.map(u=>{let link=u==='기체의 성질'?'gas.html':u==='물질의 특성'?'properties.html':u==='물질의 구성'?'particles.html':'lab.html?unit='+encodeURIComponent(u);return '<a href="'+link+'"><b>'+u+'</b> · '+(groups[u]?.length||(u==='물질의 특성'?8:7))+'개 활동</a>'}).join('')+'</section>').join('');</script></html>
