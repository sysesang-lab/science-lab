<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기체 탐구 실험실</title><style>body{font:16px system-ui;background:#edf4f5;color:#173e48;max-width:900px;margin:auto;padding:16px}section,header{background:white;border-radius:15px;padding:20px;margin:12px 0}header{background:#174650;color:white}header a{color:white}button,select,input,textarea{font:inherit}button,select{padding:10px;border:1px solid #aac7cd;border-radius:8px;background:white;color:#174650;margin:3px}button.primary,button.active{background:#176b75;color:white}button:disabled{opacity:.45}textarea{width:100%;box-sizing:border-box;min-height:65px}label{display:block;margin:12px 0}svg{width:100%;background:#f0f7f8;border-radius:10px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}small{color:#56727a}.tools{display:flex;flex-wrap:wrap;gap:8px}.tools label{border:1px solid #b9d1d5;padding:8px;border-radius:8px;margin:0}#status{background:#e5f2ef;padding:12px;border-radius:8px}h2{font-size:20px}</style><header><a href="index.html">← 전체 실험실</a><h1>기체의 성질 · 탐구 실험실</h1>실험 설계 → 조립 → 조작 → 측정 → 분석</header><nav id="nav"></nav><section><h2 id="title"></h2><p id="question"></p><label>나의 가설<textarea id="hyp"></textarea></label><h2>1. 실험 설계</h2><label>조작 변인 <select id="ind"></select></label><label>측정할 변인 <select id="dep"></select></label><label>일정하게 유지할 조건<textarea id="control"></textarea></label><h2>2. 준비물 선택</h2><div id="tools" class="tools"></div><button id="assemble" class="primary">장치 조립하기</button><p id="status" aria-live="polite"></p></section><section><h2>3. 실험대</h2><svg id="scene" viewBox="0 0 400 240"></svg><div id="actions"></div><p id="reading">측정기를 사용하세요.</p><button id="measure">측정기 읽기</button><button id="record" class="primary">측정값 기록</button><button id="reset">장치 초기화</button></section><section><h2>4. 실험 노트</h2><div id="table"></div><svg id="graph" viewBox="0 0 400 220"></svg><label>관찰 및 결론<textarea id="con"></textarea></label><details><summary>실험 설계 힌트</summary><p id="hint"></p></details><button id="reveal">실험 후 원리 확인</button><p id="principle"></p><button id="clear">현재 실험 기록 지우기</button></section><small>교육용 이상기체·입자 모형입니다. 실제 장치의 마찰, 누출, 측정 오차는 단순화했습니다. 기록은 현재 브라우저에 저장됩니다.</small><script>
const E=[
['압력과 부피','밀폐된 공기를 누르면 어떤 변화가 생길까?',['주사기','마개','추','압력계','온도계'],'추 개수','부피','온도와 기체 양','일정한 온도에서 압력과 부피는 반비례한다.'],
['온도와 부피','공기를 데우거나 식히면 부피는 어떻게 변할까?',['주사기','마개','수조','온도계','압력계'],'수조 온도','부피','기체 양과 압력','일정 압력에서 부피는 절대온도에 비례한다.'],
['온도와 압력','단단한 밀폐 용기를 데우면 압력은 어떻게 변할까?',['고정 용기','마개','수조','온도계','압력계'],'수조 온도','압력','기체 양과 용기 부피','일정 부피에서 압력은 절대온도에 비례한다.'],
['입자 수와 압력','같은 용기에 공기를 더 넣으면 어떻게 될까?',['고정 용기','마개','펌프','압력계','온도계'],'펌프 횟수','압력','온도와 부피','일정 온도와 부피에서 압력은 기체 양에 비례한다.'],
['기체 입자 운동','온도에 따라 입자의 운동은 어떻게 달라질까?',['고정 용기','마개','수조','온도계','입자 관찰기'],'수조 온도','입자 속력','기체 종류와 양','온도가 높을수록 평균 운동 에너지가 증가한다.'],
['기체의 확산','칸막이를 열면 색으로 표시한 기체 입자는 어떻게 퍼질까?',['확산 상자','칸막이','초시계','입자 관찰기'],'경과 시간','오른쪽 입자 비율','온도와 용기 크기','입자의 무작위 운동으로 농도 차이가 줄어든다.']];
const $=id=>document.getElementById(id),all=[...new Set(E.flatMap(e=>e[2])),'저울','자'];let i=0,s,store={};try{store=JSON.parse(localStorage.getItem('gas-lab-v6'))||{}}catch{};function note(){return store[i]??={hyp:'',con:'',control:'',ind:'',dep:'',rows:[]}}function save(){try{localStorage.setItem('gas-lab-v6',JSON.stringify(store))}catch{}}function initial(){s={built:false,sealed:false,stable:true,w:0,t:20,pump:0,time:0,open:false,read:false};$('reading').textContent='측정기를 사용하세요.';$('principle').textContent='';draw();}function status(t){$('status').textContent=t}function opts(id,values,v){$(id).replaceChildren(...['선택하세요',...values].map(x=>new Option(x,x)));$(id).value=v||'선택하세요'}function load(j){i=j;let e=E[i],n=note();$('title').textContent=e[0];$('question').textContent=e[1];for(let k of ['hyp','con','control'])$(k).value=n[k];opts('ind',[...new Set(E.map(x=>x[3])),'기체 양','용기 크기'],n.ind);opts('dep',['부피','압력','입자 속력','오른쪽 입자 비율','온도'],n.dep);$('tools').innerHTML=all.map(x=>`<label><input type="checkbox" value="${x}">${x}</label>`).join('');$('hint').textContent=`${e[3]}을(를) 바꾸고 ${e[4]}을(를) 측정해 보세요. 통제 조건: ${e[5]}.`;status('필요한 도구를 골라 장치를 조립하세요.');initial();table();document.querySelectorAll('nav button').forEach((b,k)=>b.classList.toggle('active',k===i))}for(let k of ['hyp','con','control','ind','dep'])$(k).oninput=()=>{note()[k]=$(k).value;save()};$('nav').innerHTML=E.map((e,j)=>`<button onclick="load(${j})">${j+1}. ${e[0]}</button>`).join('');$('assemble').onclick=()=>{let chosen=[...$('tools').querySelectorAll(':checked')].map(x=>x.value),missing=E[i][2].filter(x=>!chosen.includes(x));if(missing.length){status('장치가 완성되지 않았어요. 빠진 도구: '+missing.join(', '));return}initial();s.built=true;status(i===5?'칸막이가 닫혀 있습니다. 먼저 관찰하세요.':'장치가 조립되었습니다. 마개를 닫고 실험하세요.');draw()};function values(){let T=s.t+273.15,P=100,V=60;if(i===0){P=100+s.w*20;V=s.sealed?60*100/P:60*100/P;if(!s.sealed)P=100}if(i===1&&s.sealed)V=60*T/293.15;if(i===2&&s.sealed)P=100*T/293.15;if(i===3&&s.sealed)P=100+s.pump*15;return {x:[s.w,s.t,s.t,s.pump,s.t,s.time][i],y:[V,V,P,P,Math.sqrt(3*8.314*T/.029),s.open?50*(1-Math.exp(-s.time/12)):0][i],P,V,T:s.t}}function act(k,v){if(!s.built)return;if(k==='seal'){s.sealed=!s.sealed;if(!s.sealed){s.pump=0;status('마개를 열면 공기가 드나들어 기체 양이 일정하지 않습니다.')}}if(k==='w'){s.w=Math.max(0,Math.min(5,s.w+v));s.stable=false}if(k==='t'){s.t=v;s.stable=false}if(k==='pump'){if(!s.sealed){status('마개가 열려 공기가 빠져나갑니다.');return}s.pump=Math.min(8,s.pump+1);s.stable=false}if(k==='wait')s.stable=true;if(k==='open')s.open=true;if(k==='time'&&s.open)s.time+=v;s.read=false;$('reading').textContent='다시 측정하세요.';draw()}function draw(){let q=values(),piston=i<2,w=piston?Math.max(45,q.V*2.8):240;let x=65,y=65,h=100;let html=`<rect x="${x}" y="${y}" width="${piston?260:240}" height="${h}" rx="5" fill="white" stroke="#63838d" stroke-width="3"/>`;if(piston)html+=`<rect x="${x+w}" y="60" width="10" height="110" fill="#526c77"/><path d="M${x+w+10} 115H350" stroke="#526c77" stroke-width="8"/>`;if(i===5&&!s.open)html+='<path d="M185 65V165" stroke="#526c77" stroke-width="6"/>';if(s.built){for(let j=0;j<(i===3?30+s.pump*5:40);j++){let right=i===5&&j<Math.round(q.y*0.4),px=i===5?(right?195+j*31%100:75+j*31%100):75+j*37%Math.max(20,w-20);html+=`<circle cx="${px}" cy="${75+j*23%80}" r="3.5" fill="${i===5?'#c55b42':'#248ca0'}"/>`}if(i===0)for(let j=0;j<s.w;j++)html+=`<rect x="${x+w-10}" y="${50-j*8}" width="30" height="7" fill="#64748b"/>`;if([1,2,4].includes(i))html+=`<path d="M45 85V190H345V85" fill="none" stroke="#70b8cf" stroke-width="5"/><text x="195" y="210" text-anchor="middle" fill="#345">수조 ${s.t}°C</text>`}else html+='<text x="185" y="120" text-anchor="middle" fill="#567">준비물을 선택하세요</text>';$('scene').innerHTML=html;let b=(t,k,v=0)=>`<button onclick="act('${k}',${v})" ${s.built?'':'disabled'}>${t}</button>`;$('actions').innerHTML=(i===5?b('칸막이 열기','open')+b('5초 경과','time',5)+b('10초 경과','time',10):b(s.sealed?'마개 열기':'마개 닫기','seal')+(i===0?b('추 올리기','w',1)+b('추 빼기','w',-1):i===3?b('펌프 1회 작동','pump'):[0,20,40,60,80].map(t=>b(t+'°C 수조','t',t)).join(''))+b('열평형 기다리기','wait'))+`<p>${s.built?(i===5?'경과 '+s.time+'초':(s.sealed?'밀폐됨':'열림')+' · '+(s.stable?'평형 상태':'평형 전')):''}</p>`;$('measure').disabled=!s.built;$('record').disabled=!s.read}function valid(){if(!s.built)return false;if(i!==5&&!s.stable){status('아직 평형에 도달하지 않았습니다. 기다린 후 측정하세요.');return false}return true}$('measure').onclick=()=>{if(!valid())return;let q=values();s.read=true;$('reading').textContent=`${E[i][3]}: ${q.x} / ${E[i][4]}: ${q.y.toFixed(2)} ${['mL','mL','kPa','kPa','m/s','%'][i]}${i<4?' · 압력 '+q.P.toFixed(1)+' kPa · 온도 '+q.T+'°C':''}`;$('record').disabled=false};$('record').onclick=()=>{if(!s.read)return;let q=values();note().rows.push({x:q.x,y:q.y,p:q.P,t:q.T,ok:i===5?s.open:s.sealed});save();table();s.read=false;$('record').disabled=true;status('기록했습니다. 조건을 바꾸어 반복하세요.')};$('reset').onclick=()=>{initial();status('장치를 다시 조립하세요.')};$('clear').onclick=()=>{if(confirm('이 실험의 측정 기록만 지울까요?')){note().rows=[];save();table()}};$('reveal').onclick=()=>{let rows=note().rows.filter(r=>r.ok);$('principle').textContent=new Set(rows.map(r=>r.x)).size>=3?E[i][6]:'통제 조건을 지켜 서로 다른 조건에서 3회 이상 측정해 보세요.'};function table(){let r=note().rows;$('table').innerHTML='<table><tr><th>'+E[i][3]+'</th><th>'+E[i][4]+'</th><th>조건</th></tr>'+r.map(a=>`<tr><td>${a.x}</td><td>${a.y.toFixed(2)}</td><td>${a.ok?'정상':'통제 실패'}</td></tr>`).join('')+'</table>';let mx=Math.max(1,...r.map(a=>a.x)),my=Math.max(1,...r.map(a=>a.y));$('graph').innerHTML=`<path d="M45 20V180H380" stroke="#456" fill="none"/><text x="45" y="15" font-size="12">${E[i][4]} (${my.toFixed(1)})</text><text x="210" y="210" font-size="12">${E[i][3]} (0–${mx})</text>`+r.map(a=>`<circle cx="${45+a.x/mx*330}" cy="${180-a.y/my*150}" r="5" fill="${a.ok?'#218b91':'#c55b42'}"/>`).join('')}load(0);
</script></html>
