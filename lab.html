<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Science Lab</title><style>body{font:16px system-ui;background:#eef4f5;color:#23434b;max-width:850px;margin:auto;padding:16px}header,section{background:white;padding:20px;border-radius:16px;margin:12px 0}header{background:#174650;color:white}header a{color:white}nav{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;padding:10px;border:1px solid #b6d0d3;border-radius:8px;background:white;color:#174650;cursor:pointer}button.active,button.primary{background:#236f77;color:white}label{display:block;margin:12px 0}input[type=range],textarea{width:100%;box-sizing:border-box;accent-color:#236f77}textarea{font:inherit;padding:8px;border:1px solid #b6d0d3;border-radius:8px}svg{width:100%;background:#f5fafb;border-radius:10px}small{color:#54727a}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}output{font-size:24px;font-weight:bold}details{margin:12px 0}h2{margin-top:0}</style><header><a href="index.html">← 전체 실험실</a><h1 id="unit"></h1><div id="progress"></div></header><nav id="nav"></nav><section><h2 id="title"></h2><p id="mission"></p><label>가설<textarea id="hyp" placeholder="어떤 결과가 예상되나요?"></textarea></label><div id="controls"></div><svg id="scene" viewBox="0 0 360 180"></svg><p id="result"></p><button class="primary" id="measure">측정값 기록</button> <button id="reset">조건 초기화</button></section><section><h2>실험 기록</h2><div id="table"></div><svg id="graph" viewBox="0 0 360 220"></svg><small>가로축: 첫 번째 조건 / 세로축: 측정 결과. 두 번째 조건을 고정해 비교하세요.</small><label>결론<textarea id="con" placeholder="측정값을 근거로 설명하세요."></textarea></label><details><summary>힌트</summary>한 번에 한 조건만 바꾸고 세 번 이상 측정해 보세요. 두 조건을 각각 바꾸었을 때 어떤 차이가 있나요?</details><details><summary>원리 확인</summary><p id="principle"></p></details><button id="done" class="primary">실험 완료 표시</button> <button id="clear">기록 삭제</button></section><small>교육용 계산 모델과 개념 모식도입니다. 실제 장치의 동작, 측정 오차, 시간에 따른 변화는 단순화했습니다. 기록은 이 브라우저에 저장됩니다.</small><script src="data.js"></script><script>
const $=x=>document.getElementById(x),unit=new URLSearchParams(location.search).get('unit'),list=groups[unit]||Object.values(groups)[0];let i=0,a,b;let key='science-lab-v5:'+unit,store;try{store=JSON.parse(localStorage.getItem(key))||{}}catch{store={}};function save(){try{localStorage.setItem(key,JSON.stringify(store))}catch{}}function n(){return store[i]??=( {hyp:'',con:'',rows:[],done:false})}function d(){return list[i]}function calc(x=a,y=b){return Function('a','b','return ('+d().f+')')(x,y)}function fmt(x){return x===null?'전반사':Number(x.toFixed(4)).toString()}function text(x,y,s){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="12" fill="#23434b">${s}</text>`}function line(x,y,X,Y,c='#287b89'){return `<path d="M${x} ${y}L${X} ${Y}" stroke="${c}" stroke-width="3" fill="none"/>`}function rect(x,y,w,h,c){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${c}"/>`}function draw(){let q=d(),r=calc(),u=(a-+q.x[1])/(+q.x[2]-+q.x[1]||1),v=(b-+q.y[1])/(+q.y[2]-+q.y[1]||1),s='';switch(q.v){case 'spring':{let h=Math.min(110,Math.max(10,r*3)),pts=Array.from({length:13},(_,j)=>`${180+(j%2?12:-12)},${25+j*h/12}`).join(' ');s=line(125,20,235,20)+`<polyline points="${pts}" fill="none" stroke="#287b89" stroke-width="3"/>`+rect(155,25+h,50,25,'#809ca8');break}case 'gas':{let w=80+u*180;s=rect(35,35,290,110,'#dce9ed')+rect(35,35,w,110,'#b9e0eb')+rect(35+w,30,8,120,'#597b88');for(let j=0;j<35;j++)s+=`<circle cx="${42+(j*37)%(w-12)}" cy="${42+j*29%95}" r="3" fill="#287b89"/>`;break}case 'wave':{let pts=Array.from({length:181},(_,j)=>`${j*2},${90+Math.sin(j/180*Math.PI*2*(2+u*8))*(10+v*50)}`).join(' ');s=line(0,90,360,90,'#b4c7ce')+`<polyline points="${pts}" fill="none" stroke="#287b89" stroke-width="3"/>`;break}case 'color':s=`<circle cx="140" cy="85" r="60" fill="rgb(${a},0,0)"/><circle cx="220" cy="85" r="60" fill="rgb(0,${b},0)" style="mix-blend-mode:screen"/>`+rect(145,55,70,60,`rgb(${a},${b},0)`);break;case 'ray':{let angle=a*Math.PI/180,xx=Math.min(150,Math.abs(Math.sin(angle))*130);s=line(20,90,340,90,'#8caab6')+line(180,10,180,165,'#b6c8ce')+line(180-xx,90-Math.cos(angle)*80,180,90,'#d8a42f');if(q.t==='빛의 반사'||r===null)s+=line(180,90,180+xx,90-Math.cos(angle)*80,'#d8a42f');else if(q.t.includes('굴절')||q.t.includes('분산'))s+=line(180,90,180+Math.sin(r*Math.PI/180)*80,90+Math.cos(r*Math.PI/180)*80,'#d8a42f');else s+=text(180,150,'광학 조건 비교 모형');break}case 'series':case 'parallel':case 'circuit':s=`<path d="M65 35H295V145H65Z" fill="none" stroke="#527785" stroke-width="3"/>`+rect(55,70,20,35,'#d4a94f')+rect(140,25,65,20,'#829ca8');if(q.v==='series')s+=rect(220,25,45,20,'#829ca8');if(q.v==='parallel')s+=line(110,35,110,90)+line(110,90,250,90)+line(250,90,250,35)+rect(150,80,65,20,'#829ca8');s+=text(180,130,'회로 개념 모형');break;case 'magnet':for(let j=1;j<=5;j++)s+=`<ellipse cx="180" cy="85" rx="${j*25}" ry="${j*13}" fill="none" stroke="#287b89" opacity="${.2+u*.7}"/>`;s+=rect(170,25,20,120,'#8199a4');break;case 'phase':case 'reaction':case 'charge':{for(let j=0;j<30;j++){let x=30+j%10*32,y=40+Math.floor(j/10)*40;s+=`<circle cx="${x+(j*7%13)*u}" cy="${y+(j*11%17)*v}" r="7" fill="${j<30*u?'#d5a34c':'#70a9c0'}"/>`}s+=text(180,165,'입자 개념 모식도 (정량 배열 아님)');break}case 'motion':s=line(25,130,335,130)+rect(25+u*250,90,45,35,'#287b89')+text(180,155,'조건에 따른 위치 개념 표시');break;default:s=rect(45,45,110,100,'#e0ecef')+rect(45,145-100*u,110,100*u,'#77b3c5')+rect(205,45,110,100,'#e0ecef')+rect(205,145-100*v,110,100*v,'#d5a34c')+text(100,165,q.x[0])+text(260,165,q.y[0]);} $('scene').innerHTML=s;$('result').innerHTML=q.r+' : <output>'+fmt(r)+'</output>'}function graph(){let rows=n().rows.filter(r=>r[2]!==null),s=line(45,15,45,180)+line(45,180,345,180);if(rows.length){let xmin=+d().x[1],xmax=+d().x[2],ys=rows.map(r=>r[2]),lo=Math.min(0,...ys),hi=Math.max(1,...ys);for(let j=0;j<5;j++){let y=180-j*40;s+=text(22,y,fmt(lo+(hi-lo)*j/4))+text(45+j*75,200,fmt(xmin+(xmax-xmin)*j/4))}for(let r of rows)s+=`<circle cx="${45+300*(r[0]-xmin)/(xmax-xmin||1)}" cy="${180-160*(r[2]-lo)/(hi-lo)}" r="4" fill="#287b89"/>`}$('graph').innerHTML=s;$('table').innerHTML='<table><tr><th>'+d().x[0]+'</th><th>'+d().y[0]+'</th><th>'+d().r+'</th></tr>'+n().rows.map(r=>'<tr>'+r.map(x=>'<td>'+fmt(x)+'</td>').join('')+'</tr>').join('')+'</table>'}function open(j){i=j;let q=d();a=+q.x[3];b=+q.y[3];$('unit').textContent=unit;$('title').textContent=q.t;$('mission').textContent=q.x[0]+'과 '+q.y[0]+' 조건을 바꾸며 '+q.r+'의 변화를 탐구하세요.';$('nav').innerHTML='';list.forEach((e,k)=>{let btn=document.createElement('button');btn.textContent=e.t+(store[k]?.done?' ✓':'');btn.className=k===i?'active':'';btn.onclick=()=>open(k);$('nav').append(btn)});$('progress').textContent=Object.values(store).filter(x=>x.done).length+' / '+list.length+' 완료';$('controls').innerHTML='';[q.x,q.y].forEach((z,k)=>{let l=document.createElement('label'),span=document.createElement('span'),inp=document.createElement('input');inp.type='range';inp.min=z[1];inp.max=z[2];inp.step='any';if(['개','회/m'].includes(z[4]))inp.step='1';inp.value=z[3];if(z[1]===z[2])inp.disabled=true;function update(){let val=+inp.value;span.textContent=z[0]+': '+fmt(val)+' '+z[4];if(k)b=val;else a=val;draw()}l.append(span,inp);$('controls').append(l);inp.oninput=update;span.textContent=z[0]+': '+z[3]+' '+z[4]});$('hyp').value=n().hyp;$('con').value=n().con;$('principle').textContent=q.e;draw();graph()}$('hyp').oninput=()=>{n().hyp=$('hyp').value;save()};$('con').oninput=()=>{n().con=$('con').value;save()};$('measure').onclick=()=>{n().rows.push([a,b,calc()]);save();graph()};$('reset').onclick=()=>open(i);$('done').onclick=()=>{n().done=true;save();open(i)};$('clear').onclick=()=>{if(confirm('현재 실험의 기록을 삭제할까요?')){delete store[i];save();open(i)}};open(0);
</script></html>
