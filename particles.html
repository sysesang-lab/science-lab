<!doctype html><html lang="ko"><meta charset="utf-8"><script src="design.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>물질의 구성</title><style>body{font:16px system-ui;background:#eef4f5;color:#23434b;max-width:850px;margin:auto;padding:16px}header,section{background:white;padding:20px;border-radius:16px;margin:12px 0}header{background:#174650;color:white}header a{color:white}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button,select{font:inherit;padding:10px;border:1px solid #b6d0d3;border-radius:8px;background:white;color:#174650;cursor:pointer}button.active{background:#236f77;color:white}label{display:block;margin:12px 0}input[type=range],textarea{width:100%;box-sizing:border-box}textarea{font:inherit;padding:8px}svg{width:100%;background:#f5fafb;border-radius:10px}li{margin:8px 0}small{color:#54727a}</style><header><a href="index.html">← 전체 실험실</a><h1>물질의 구성</h1><div id="progress"></div></header><nav id="nav"></nav><section><h2 id="title"></h2><p id="mission"></p><input type="hidden" id="hyp"><div id="extraDesign"></div><div id="controls"></div><svg id="scene" viewBox="0 0 360 220"></svg><p id="result"></p><div id="actions"></div></section><section><h3>실험 노트</h3><button onclick="record()">관찰 기록</button> <button onclick="reset()">장치 초기화</button><ol id="records"></ol><input type="hidden" id="con"><details><summary>힌트</summary><p id="hint"></p></details><details><summary>원리</summary><p id="principle"></p></details><button onclick="done()">실험 완료</button></section><small>교육용 모형: 원자 크기와 거리, 이온 이동 및 침전은 실제 비율이나 속도를 재현하지 않습니다.</small><script>
const $=id=>document.getElementById(id), names=['원자의 구조','원소와 원자','분자 모형','입자 모형 분류','이온의 형성','이온의 이동','앙금 생성 반응'], missions=['입자 수를 바꾸어 전하와 질량수를 비교하세요.','양성자 수와 중성자 수를 바꾸어 원소의 정체를 확인하세요.','원자를 추가하여 물, 산소, 이산화탄소 분자를 구성하세요.','입자 종류를 선택하고 순물질인지 혼합물인지 판단하세요.','전자를 얻거나 잃게 하여 이온을 만들어 보세요.','전극의 방향을 바꾸고 이온 이동을 관찰하세요.','두 수용액을 선택하고 섞어서 앙금이 생기는지 확인하세요.'], hints=['양성자는 +1, 전자는 −1의 전하를 갖습니다.','원소를 결정하는 입자는 무엇일까요?','물은 H₂O입니다.','입자의 종류가 몇 가지인가요?','양성자 수는 변하지 않습니다.','서로 다른 전하끼리 끌어당깁니다.','은 이온과 염화 이온을 함께 넣어 보세요.'], principles=['전하량(기본 전하 단위)=양성자 수−전자 수. 질량수=양성자 수+중성자 수.','원자 번호는 양성자 수이며 중성자 수가 달라도 같은 원소일 수 있습니다.','분자는 원자가 일정한 비율과 구조로 결합한 입자입니다. 원자 수만으로 결합 구조가 모두 결정되지는 않습니다.','한 종류의 물질이면 순물질, 여러 물질이 섞이면 혼합물입니다.','전자를 잃으면 양이온, 얻으면 음이온이 됩니다.','양이온은 음극으로, 음이온은 양극으로 이동합니다.','Ag⁺ + Cl⁻ → AgCl(s), Ba²⁺ + SO₄²⁻ → BaSO₄(s). 두 앙금은 흰색입니다.'];
const elements=['','H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar'];const fresh=()=>[{p:6,n:6,e:6},{p:6,n:6},{h:0,o:0,c:0},{type:0},{el:0,e:11},{reverse:0,t:0},{a:0,b:0,mix:false}];let states=fresh(),i=0,notes=names.map(()=>({h:'',c:'',r:[],done:false}));try{let z=JSON.parse(localStorage.getItem('scienceLabParticlesV1'));if(Array.isArray(z)&&z.length===7)notes=z}catch{}const s=()=>states[i],n=()=>notes[i];function save(){n().h=$('hyp').value;n().c=$('con').value;try{localStorage.setItem('scienceLabParticlesV1',JSON.stringify(notes))}catch{}}function choose(j){save();i=j;render()}function reset(){states[i]=fresh()[i];render()}function done(){n().done=true;save();render()}function set(k,v){s()[k]=+v;if(i===4&&k==='el')s().e=[11,17,12,8][s().el];if(i===5)s().t=0;if(i===6)s().mix=false;render()}function add(k,d){s()[k]=Math.max(0,Math.min(18,s()[k]+d));render()}function range(k,l,min,max){return `<label>${l}: ${s()[k]}<input type="range" min="${min}" max="${max}" value="${s()[k]}" onchange="set('${k}',this.value)"></label>`}function select(k,l,opts){return `<label>${l} <select onchange="set('${k}',this.value)">${opts.map((v,j)=>`<option value="${j}" ${s()[k]===j?'selected':''}>${v}</option>`).join('')}</select></label>`}function btn(l,code){return `<button onclick="${code}">${l}</button> `}function text(x,y,t){return `<text x="${x}" y="${y}" text-anchor="middle" font-size="12" fill="#23434b">${t}</text>`}function ball(x,y,t,c,r=13){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`+`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="white">${t}</text>`}function atom(p,n,e){let a='';for(let j=0;j<p+n;j++){let r=7*Math.sqrt(j),t=j*2.4;a+=ball(180+r*Math.cos(t),110+r*Math.sin(t),j<p?'+':'0',j<p?'#bc6356':'#758998',7)}let left=e;[2,8,8].forEach((cap,k)=>{let r=45+k*24,m=Math.min(cap,left);left-=m;a+=`<circle cx="180" cy="110" r="${r}" fill="none" stroke="#b6ccd3"/>`;for(let j=0;j<m;j++){let t=j*2*Math.PI/m;a+=ball(180+r*Math.cos(t),110+r*Math.sin(t),'−','#287b89',7)}});return a}function precip(x){return x.a===0&&x.b===0?'AgCl':x.a===1&&x.b===1?'BaSO₄':''}function render(){let x=s(),c='',a='',v='',g='';switch(i){case 0:c=range('p','양성자',1,18)+range('n','중성자',0,18)+range('e','전자',0,18);g=atom(x.p,x.n,x.e);v=`원소 ${elements[x.p]} / 질량수 ${x.p+x.n} / 전하 ${x.p-x.e}`;break;case 1:c=range('p','양성자',1,18)+range('n','중성자',0,18);g=atom(x.p,x.n,x.p);v=`원자 번호 ${x.p} / 원소 ${elements[x.p]} / 질량수 ${x.p+x.n}`;break;case 2:a=btn('H 추가',"add('h',1)")+btn('O 추가',"add('o',1)")+btn('C 추가',"add('c',1)");let arr=[...Array(x.h).fill('H'),...Array(x.o).fill('O'),...Array(x.c).fill('C')];g=arr.map((z,j)=>ball(30+j%10*33,35+Math.floor(j/10)*32,z,{H:'#8096a3',O:'#bc6356',C:'#344b56'}[z])).join('');let match=x.h===2&&x.o===1&&!x.c?'H₂O (물)':!x.h&&x.o===2&&!x.c?'O₂ (산소)':!x.h&&x.o===2&&x.c===1?'CO₂ (이산화탄소)':'';if(match){g=match.startsWith('H')?ball(180,100,'O','#bc6356',23)+ball(145,130,'H','#8096a3',17)+ball(215,130,'H','#8096a3',17):ball(130,110,'O','#bc6356',23)+ball(180,110,match.startsWith('C')?'C':'O',match.startsWith('C')?'#344b56':'#bc6356',23)+(match.startsWith('C')?ball(230,110,'O','#bc6356',23):'')}v=`H ${x.h}, O ${x.o}, C ${x.c} — ${match||'원자 조합 (결합 미확정)'}`;break;case 3:c=select('type','입자 종류',['산소만','물만','산소와 물','헬륨만']);for(let j=0;j<12;j++){let xx=35+j%4*95,yy=35+Math.floor(j/4)*70;let t=x.type===2?j%2:x.type;if(t===0)g+=ball(xx,yy,'O','#bc6356',10)+ball(xx+18,yy,'O','#bc6356',10);else if(t===1)g+=ball(xx,yy,'O','#bc6356',13)+ball(xx-13,yy+13,'H','#8096a3',8)+ball(xx+13,yy+13,'H','#8096a3',8);else g+=ball(xx,yy,'He','#287b89',13)}v=['산소 분자 한 종류','물 분자 한 종류','산소와 물 두 종류','헬륨 원자 한 종류'][x.type];break;case 4:let p=[11,17,12,8][x.el];c=select('el','원소',['Na','Cl','Mg','O']);a=btn('전자 얻기',"add('e',1)")+btn('전자 잃기',"add('e',-1)");g=atom(p,p,x.e);v=`${elements[p]} / 전자 ${x.e} / 전하 ${p-x.e} (${p===x.e?'중성':p>x.e?'양이온':'음이온'})`;break;case 5:c=select('reverse','전극 방향',['왼쪽 음극','왼쪽 양극']);a=btn('전기장 적용',"setTime()");g=`<rect x="12" y="30" width="15" height="160" fill="#78909c"/><rect x="333" y="30" width="15" height="160" fill="#78909c"/>`+text(20,20,x.reverse?'+':'−')+text(340,20,x.reverse?'−':'+');for(let j=0;j<6;j++){let d=Math.min(100,x.t*15)*(x.reverse?-1:1);g+=ball(150-d+j%2*25,45+j*25,'+','#bc6356',10)+ball(210+d-j%2*25,45+j*25,'−','#287b89',10)}v=`전기장 적용 ${x.t}단계`;break;case 6:c=select('a','수용액 A',['질산은','질산바륨','질산나트륨'])+select('b','수용액 B',['염화나트륨','황산나트륨','질산칼륨']);a=btn('혼합하기',"mix()");g='<path d="M90 25V190H270V25" fill="none" stroke="#78909c" stroke-width="3"/><rect x="92" y="75" width="176" height="113" fill="#b9e1ed"/>';if(x.mix&&precip(x))for(let j=0;j<45;j++)g+=`<circle cx="${100+j*23%160}" cy="${165+j*13%20}" r="4" fill="white" stroke="#b5c2c9"/>`;v=x.mix?(precip(x)?'흰색 '+precip(x)+' 앙금 생성':'앙금 없음'):'혼합 전';break}$('nav').innerHTML=names.map((z,j)=>`<button class="${i===j?'active':''}" onclick="choose(${j})">${j+9}. ${z}${notes[j].done?' ✓':''}</button>`).join('');$('progress').textContent=notes.filter(z=>z.done).length+'/7 완료';$('title').textContent=names[i];$('mission').textContent=missions[i];$('hyp').value=n().h;$('con').value=n().c;$('controls').innerHTML=c;$('actions').innerHTML=a;$('scene').innerHTML=g;$('result').textContent=v;$('hint').textContent=hints[i];$('principle').textContent=principles[i];$('records').replaceChildren(...n().r.map(z=>{let li=document.createElement('li');li.textContent=z;return li}))}function setTime(){s().t=Math.min(7,s().t+1);render()}function mix(){s().mix=true;render()}function record(){n().r.push($('result').textContent);save();render()}render();
(function(){let root=$('extraDesign'),title=$('title'),spec=[["전자 수", "양성자 수", "원자 전하", "중성자 수"], ["양성자 수", "중성자 수", "원소 종류"], ["원자 개수", "원자 종류", "분자 구성"], ["입자 종류", "입자 개수", "물질 분류"], ["전자 수", "원소 종류", "이온 전하"], ["전압", "이온 종류", "이온 이동", "용액 농도"], ["혼합 용액 종류", "용액 양", "앙금 생성 여부", "온도"]];let last=-1;function load(){if(last===i)return;last=i;let [a,b,c,...extras]=spec[i];designChoices(root,'particles:'+i,a,b,c,$('hyp'),extras)}new MutationObserver(load).observe(title,{childList:true,subtree:true});load()})();
</script></html>
